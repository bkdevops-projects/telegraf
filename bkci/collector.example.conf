# Copy to <Agent work directory>/collector.conf, then restart Agent.
# Only [[inputs.bkci_external]] extensions are accepted in this file.
# The build includes native influx, json and prometheus parsers.

[[inputs.bkci_external]]
  alias = "custom-exporter"
  url = "http://127.0.0.1:9100/metrics"
  timeout = "3s"
  interval = "1m"
  data_format = "prometheus"
  prometheus_metric_version = 1
  mapping = "measurement_field"
  field_prefix = "custom_"

# Scripts are supported on Windows and Linux with OS containment only.
# Each instance contains exactly one argument array, not a shell command string.
# Windows:
# [[inputs.bkci_external]]
#   alias = "custom-script"
#   command = ["powershell.exe", "-NoProfile", "-File", "D:/agent/scripts/metrics.ps1"]
#   timeout = "3s"
#   interval = "1m"
#   data_format = "influx"
#   mapping = "fields"
#   field_prefix = "script_"
# Script stdout example: custom build_queue=4i,temperature=42.5
# The actual measurement sent to BK-CI is always env.

# JSON fields remain field names; numeric conversion uses Telegraf's json parser.
